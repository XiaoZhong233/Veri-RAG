name: veri-rag

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: veri-rag:latest
    container_name: veri-rag-app
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      FILE_UPLOAD_PATH: /app/file
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in your environment file}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://llm-1yauwtsqkmv66e2w.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen3.7-flash}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-5m}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1000}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-veri_rag}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-veri_rag}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your environment file}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment file}
      SPRING_AI_VECTORSTORE_REDIS_INITIALIZE_SCHEMA: ${SPRING_AI_VECTORSTORE_REDIS_INITIALIZE_SCHEMA:-true}
      SPRING_AI_VECTORSTORE_REDIS_INDEX_NAME: ${SPRING_AI_VECTORSTORE_REDIS_INDEX_NAME:-veri-rag-index}
      SPRING_AI_VECTORSTORE_REDIS_PREFIX: ${SPRING_AI_VECTORSTORE_REDIS_PREFIX:-veri-rag:embedding:}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-50MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-55MB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment file}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      RAG_INTENT_CLASSIFIER_ENABLED: ${RAG_INTENT_CLASSIFIER_ENABLED:-true}
      RAG_INTENT_JAVA_RULES_ENABLED: ${RAG_INTENT_JAVA_RULES_ENABLED:-false}
      RAG_INTENT_CLASSIFIER_TIMEOUT: ${RAG_INTENT_CLASSIFIER_TIMEOUT:-15s}
      RAG_INTENT_CLASSIFIER_MODEL: ${RAG_INTENT_CLASSIFIER_MODEL:-}
      RAG_INTENT_CLASSIFIER_THINKING_ENABLED: ${RAG_INTENT_CLASSIFIER_THINKING_ENABLED:-false}
      RAG_MANUAL_HISTORY_ENABLED: ${RAG_MANUAL_HISTORY_ENABLED:-false}
      RAG_HISTORY_MAX_MESSAGES: ${RAG_HISTORY_MAX_MESSAGES:-6}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_MAX_NUM_CHUNKS: ${RAG_MAX_NUM_CHUNKS:-10000}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-20}
      RAG_RETRIEVAL_TOP_K: ${RAG_RETRIEVAL_TOP_K:-8}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.75}
      RAG_ANSWER_CACHE_ENABLED: ${RAG_ANSWER_CACHE_ENABLED:-false}
      RAG_ANSWER_CACHE_SIMILARITY_THRESHOLD: ${RAG_ANSWER_CACHE_SIMILARITY_THRESHOLD:-0.93}
      RAG_ANSWER_CACHE_TTL_MINUTES: ${RAG_ANSWER_CACHE_TTL_MINUTES:-15}
      RAG_ANSWER_CACHE_MAX_ENTRIES: ${RAG_ANSWER_CACHE_MAX_ENTRIES:-200}
      RAG_MEMORY_ENABLED: ${RAG_MEMORY_ENABLED:-true}
      RAG_MEMORY_RECENT_MESSAGES: ${RAG_MEMORY_RECENT_MESSAGES:-8}
      RAG_MEMORY_SUMMARY_TRIGGER_MESSAGES: ${RAG_MEMORY_SUMMARY_TRIGGER_MESSAGES:-12}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://observability:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://observability:4318/v1/metrics
      OTEL_METRICS_EXPORT_STEP: ${OTEL_METRICS_EXPORT_STEP:-15s}
      OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:-1.0}
      WECOM_BOT_ENABLED: ${WECOM_BOT_ENABLED:-false}
      WECOM_BOT_ID: ${WECOM_BOT_ID:-}
      WECOM_BOT_SECRET: ${WECOM_BOT_SECRET:-}
      WECOM_BOT_DISPLAY_NAME: ${WECOM_BOT_DISPLAY_NAME:-londonist 助手}
      WECOM_BOT_WEBSOCKET_URL: ${WECOM_BOT_WEBSOCKET_URL:-wss://openws.work.weixin.qq.com}
      WECOM_BOT_USER_ID: ${WECOM_BOT_USER_ID:-2}
      WECOM_BOT_HEARTBEAT_INTERVAL: ${WECOM_BOT_HEARTBEAT_INTERVAL:-30s}
      WECOM_BOT_STREAM_UPDATE_INTERVAL: ${WECOM_BOT_STREAM_UPDATE_INTERVAL:-2500ms}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - app-files:/app/file
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/veri-rag/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  mysql:
    image: mysql:8.4
    container_name: veri-rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-veri_rag}
      MYSQL_USER: ${MYSQL_USER:-veri_rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-veri_rag_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    # Redis Stack Server includes RediSearch, required by Spring AI RedisVectorStore (FT.* commands).
    image: redis/redis-stack-server:7.4.0-v8
    container_name: veri-rag-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-veri_rag_dev}
      REDIS_ARGS: --appendonly yes --requirepass ${REDIS_PASSWORD:-veri_rag_dev}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG && redis-cli -a \"$${REDIS_PASSWORD}\" FT._LIST >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  observability:
    image: grafana/otel-lgtm:0.27.1
    container_name: veri-rag-observability
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      # Persists Grafana dashboards/users and Prometheus data across container recreation.
      - observability-data:/data
      - ./observability/prometheus.yml:/otel-lgtm/prometheus.yaml:ro
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"

  nginx:
    image: nginx:1.27-alpine
    container_name: veri-rag-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      observability:
        condition: service_started
    ports:
      - "${NGINX_BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  app-files:
  mysql-data:
  redis-data:
  observability-data:
