spring:
  application:
    name: veri-rag
  reactor:
    # 流式 ChatClient 会切换到 boundedElastic 等异步线程；auto 会恢复 OTel Trace/MDC 上下文。
    context-propagation: auto
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_BASE_URL:https://llm-1yauwtsqkmv66e2w.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      chat:
#        model: qwen3.7-plus
        model: ${LLM_CHAT_MODEL:qwen3.7-flash-2026-07-15}
#        model: qwen-flash
        # 模型单次 HTTP 请求总超时；超过30秒由 SDK 主动取消底层请求。
        timeout: ${LLM_TIMEOUT:30s}
        # 限制单次输出，避免冗长回答拉高 LLM 完整生成 P90；可通过 LLM_MAX_TOKENS 覆盖。
        max-tokens: ${LLM_MAX_TOKENS:1000}
        # 企业知识库问答以稳定、简洁为主，降低随机性和重复输出概率。
        temperature: ${LLM_TEMPERATURE:0.2}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
    vectorstore:
      redis:
        initialize-schema: true
        index-name: veri-rag-index
        prefix: "veri-rag:embedding:"
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      client-type: jedis
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/veri_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # schema.sql 仅使用幂等建表/初始化语句，可安全补齐已有 veri_rag 数据库的业务表。
      mode: always


server:
  port: 8081
  servlet:
    context-path: /veri-rag

