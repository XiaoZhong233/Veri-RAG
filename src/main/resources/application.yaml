spring:
  application:
    name: veri-rag
  reactor:
    # 流式 ChatClient 会切换到 boundedElastic 等异步线程；auto 会恢复 OTel Trace/MDC 上下文。
    context-propagation: auto
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_BASE_URL:https://llm-1yauwtsqkmv66e2w.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      chat:
        model: ${LLM_CHAT_MODEL:qwen-flash}
        # 限制单次输出，避免冗长回答拉高 LLM 完整生成 P90；可通过 LLM_MAX_TOKENS 覆盖。
        max-tokens: ${LLM_MAX_TOKENS:1000}
        # 企业知识库问答以稳定、简洁为主，降低随机性和重复输出概率。
        temperature: ${LLM_TEMPERATURE:0.2}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
    vectorstore:
      redis:
        initialize-schema: ${SPRING_AI_VECTORSTORE_REDIS_INITIALIZE_SCHEMA:true}
        index-name: ${SPRING_AI_VECTORSTORE_REDIS_INDEX_NAME:veri-rag-index}
        prefix: ${SPRING_AI_VECTORSTORE_REDIS_PREFIX:veri-rag:embedding:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
#      password: ${SPRING_DATA_REDIS_PASSWORD:veri_rag_dev}
      client-type: jedis
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 单个知识库文件上限；扫描 PDF 常包含高分辨率页面，默认 1MB 不足以使用。
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
      # 包含 multipart 边界、分类和标题字段，略大于单文件上限即可。
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:55MB}


server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /veri-rag

file:
  upload:
    path: ${FILE_UPLOAD_PATH:file}

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.example.verirag: ${APP_LOG_LEVEL:DEBUG}
    com.example.verirag.mapper: WARN
    org.springframework.ai: DEBUG
    org.mybatis: WARN

# Metrics、Trace 与日志可通过 traceId 关联；OTLP 默认发送到 compose 中暴露的 4318 端口。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    # Demo 全量采样便于诊断；生产可按流量下调，例如 0.1。
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        # 本地 demo 缩短推送周期，便于压测后迅速在 Grafana 看到指标；生产建议改回 30s 或 60s。
        step: ${OTEL_METRICS_EXPORT_STEP:15s}
mybatis-plus:
  mapper-locations:
    - classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:VYdac/JBAW+noUscEgYffr/TlUgPwCHZkFkULziZ8kTZOb6sF6ylZYgXj4XisLr4}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

rag:
  chat:
    # 对仅接受 system/user 角色的兼容模型，将摘要和历史压成纯文本拼进当前 user message。
    # 设为 false 时恢复 Spring AI ChatMemory Advisor 的原生多角色记忆。
    manual-history-enabled: ${RAG_MANUAL_HISTORY_ENABLED:false}
    # 用于检索 Query 改写及手动历史拼接的最近消息条数；不影响数据库中保存的完整聊天记录。
    history-max-messages: ${RAG_HISTORY_MAX_MESSAGES:6}
  ingest:
    # 单个向量 chunk 的最大 token 数；制度/流程类文档建议 500~800，越小召回越细、chunk 数越多。
    chunk-size: ${RAG_CHUNK_SIZE:500}
    # 单个源文件最多生成多少个 chunk，防止异常超长文件带来过高 embedding 成本。
    max-num-chunks: ${RAG_MAX_NUM_CHUNKS:10000}
  ocr:
    # PDF 文本层平均每页少于 min-chars-per-page 时，使用 Tesseract OCR。
    enabled: ${RAG_OCR_ENABLED:true}
    language: ${RAG_OCR_LANGUAGE:chi_sim+eng}
    min-chars-per-page: ${RAG_OCR_MIN_CHARS_PER_PAGE:40}
    # 防止超大扫描件长时间占用上传请求线程；可按部署资源调整。
    max-pages: ${RAG_OCR_MAX_PAGES:50}
    dpi: ${RAG_OCR_DPI:300}
    timeout-seconds: ${RAG_OCR_TIMEOUT_SECONDS:120}
  retrieval:
    # 每次向量检索最多返回的 Chunk 数；制度问答默认 2 个即可，减少 Prompt 长度与模型延迟。
    top-k: ${RAG_RETRIEVAL_TOP_K:3}
    # 向量检索最低相似度（0~1）；低于该值不作为上下文或引用，建议 0.70~0.80。
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.75}
  answer-cache:
    # 是否启用相似问题回答缓存；命中后跳过检索和大模型调用。
    enabled: ${RAG_ANSWER_CACHE_ENABLED:false}
    # 缓存复用的最低问题语义相似度（0~1）；0.93 在准确性与命中率之间折中，仅复用相同分类范围的新会话问题。
    similarity-threshold: ${RAG_ANSWER_CACHE_SIMILARITY_THRESHOLD:0.93}
    # 单条回答缓存有效期（分钟）；知识库文档变更后会主动清空全部缓存。
    ttl-minutes: ${RAG_ANSWER_CACHE_TTL_MINUTES:15}
    # 内存中最多保留的回答缓存数量；超出后优先清理最早过期的记录。
    max-entries: ${RAG_ANSWER_CACHE_MAX_ENTRIES:200}

  memory:
    # 启用会话摘要：完整记录仍保留在 MySQL，模型仅接收摘要与最近原始消息。
    enabled: ${RAG_MEMORY_ENABLED:true}
    # 始终保留的最新原始消息数；4 条约为最近两轮对话。
    recent-messages: ${RAG_MEMORY_RECENT_MESSAGES:8}
    # 未压缩消息累计到该值后，后台将较早消息合并到摘要中；6 条约为 3 轮对话。
    summary-trigger-messages: ${RAG_MEMORY_SUMMARY_TRIGGER_MESSAGES:12}
