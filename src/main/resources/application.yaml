spring:
  application:
    name: veri-rag
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://llm-1yauwtsqkmv66e2w.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen3.6-flash
      embedding:
        model: qwen3.7-text-embedding
        dimensions: 1024
    vectorstore:
      redis:
        initialize-schema: true
        index-name: veri-rag-index
        prefix: "veri-rag:embedding:"
  data:
    redis:
      url: redis://localhost:6380
      client-type: jedis
  datasource:
    url: jdbc:mysql://localhost:3306/veri_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver


server:
  port: 8081
  servlet:
    context-path: /veri-rag

file:
  upload:
    path: file

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.example.verirag: ${APP_LOG_LEVEL:DEBUG}
    com.example.verirag.mapper: WARN
    org.springframework.ai: DEBUG
    org.mybatis: WARN
mybatis-plus:
  mapper-locations:
    - classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: VYdac/JBAW+noUscEgYffr/TlUgPwCHZkFkULziZ8kTZOb6sF6ylZYgXj4XisLr4
  expire-hours: 24

rag:
  ingest:
    chunk-size: ${RAG_CHUNK_SIZE:800}
    max-num-chunks: ${RAG_MAX_NUM_CHUNKS:10000}
  retrieval:
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.70}
  answer-cache:
    enabled: ${RAG_ANSWER_CACHE_ENABLED:true}
    similarity-threshold: ${RAG_ANSWER_CACHE_SIMILARITY_THRESHOLD:0.93}
    ttl-minutes: ${RAG_ANSWER_CACHE_TTL_MINUTES:15}
    max-entries: ${RAG_ANSWER_CACHE_MAX_ENTRIES:200}
