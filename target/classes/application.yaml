spring:
  application:
    name: veri-rag
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://llm-1yauwtsqkmv66e2w.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen3.7-plus
      embedding:
        model: qwen3.7-text-embedding
        dimensions: 1024
    vectorstore:
      redis:
        initialize-schema: true
        index-name: custom-index
        prefix: custom-prefix
  data:
    redis:
      url: redis://localhost:6380
      client-type: jedis


server:
  port: 8081
  servlet:
    context-path: /veri-rag

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.example.verirag: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.ai: debug
